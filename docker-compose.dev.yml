services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 2seats
      POSTGRES_USER: 2seats
      POSTGRES_PASSWORD: 2seats_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 2seats -d 2seats"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: 2seats_dev
      MINIO_ROOT_PASSWORD: 2seats_dev_secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
  livekit:
    image: livekit/livekit-server:v1.8.1
    command: --config /etc/livekit.yaml
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
      - ./infra/coturn/certs:/etc/coturn/certs:ro
    depends_on:
      redis:
        condition: service_healthy
  coturn:
    image: coturn/coturn:4.6.3
    command: -c /etc/coturn/turnserver.conf
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:5349:5349/tcp"
      - "127.0.0.1:443:443/tcp"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./infra/coturn/certs:/etc/coturn/certs:ro
volumes:
  postgres_data:
  minio_data:
