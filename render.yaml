services:
  - type: web
    name: 2seats-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @2seats/api prisma:generate && corepack pnpm --filter @2seats/api build
    startCommand: corepack pnpm --filter @2seats/api exec prisma migrate deploy && corepack pnpm --filter @2seats/api start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: 2seats-uploads
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: TURN_DOMAIN
        sync: false
      - key: TURN_PUBLIC_IP
        sync: false
      - key: NEKO_IMAGE
        sync: false
